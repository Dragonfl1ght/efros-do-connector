server:
  port: 8080

spring:
  application:
    name: efros-do-connector

connector:
  edo:
    connect-timeout: 5s
    read-timeout: 30s
  e4:
    connect-timeout: 5s
    read-timeout: 30s
  tm:
    service-uid: efrosdo_uko
    connect-timeout: 5s
    read-timeout: 30s
    status-delay: 2s

logging:
  level:
    ru.company.connector.efrosdo: INFO
  charset:
    console: UTF-8
    file: UTF-8
